# Apply pending Supabase migrations when staging or production is updated.
# No seeding — seed-local.mjs stays local-only.
#
# Required GitHub Actions secrets:
#   SUPABASE_ACCESS_TOKEN      — https://supabase.com/dashboard/account/tokens
#   STAGING_PROJECT_ID         — staging Supabase project ref
#   STAGING_DB_PASSWORD        — staging database password
#   PRODUCTION_PROJECT_ID      — production Supabase project ref
#   PRODUCTION_DB_PASSWORD     — production database password
#
# If `db push` fails with a migration-history mismatch, repair once locally
# (see railway_deployment.md), then re-run this workflow.

name: Migrate Supabase DB

on:
  push:
    branches: [staging, production]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: migrate-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${{ github.ref_name }}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          case "$ENV" in
            staging)
              echo "project_id_secret=STAGING_PROJECT_ID" >> "$GITHUB_OUTPUT"
              echo "db_password_secret=STAGING_DB_PASSWORD" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "project_id_secret=PRODUCTION_PROJECT_ID" >> "$GITHUB_OUTPUT"
              echo "db_password_secret=PRODUCTION_DB_PASSWORD" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported branch/environment '$ENV'. Use staging or production."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Load environment secrets
        id: secrets
        env:
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          ENV="${{ steps.target.outputs.environment }}"
          if [ "$ENV" = "staging" ]; then
            PROJECT_ID="$STAGING_PROJECT_ID"
            DB_PASSWORD="$STAGING_DB_PASSWORD"
          else
            PROJECT_ID="$PRODUCTION_PROJECT_ID"
            DB_PASSWORD="$PRODUCTION_DB_PASSWORD"
          fi

          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::${{ steps.target.outputs.project_id_secret }} is not set."
            missing=1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::${{ steps.target.outputs.db_password_secret }} is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          {
            echo "SUPABASE_PROJECT_ID=$PROJECT_ID"
            echo "SUPABASE_DB_PASSWORD=$DB_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Target: $ENV → project $PROJECT_ID"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list

      - name: Push pending migrations
        run: supabase db push --yes
